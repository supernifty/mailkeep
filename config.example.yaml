schema_version: 1
account:
  account_id: personal-gmail
  provider: gmail
  host: imap.gmail.com
  port: 993
  username: person@example.com
  password_env: MAILKEEP_GMAIL_PASSWORD
  source_label: Mailkeep
  processed_label: Mailkeep-Processed
paths:
  archive_root: ./mailkeep-data/archive
  obsidian_vault: ~/ObsidianVault
  obsidian_folder: Mailkeep
  database: ./mailkeep-data/mailkeep.sqlite3
# env_file: ./.env
retention_days: 90
deletion_enabled: false
limits:
  messages_per_run: 100
  bytes_per_run: 1073741824
categories:
  receipts: 0.70
  travel: 0.75
document_types:
  - invoice
  - receipt
  - booking
document_type_confidence: 0.70
extraction_fields:
  - amount
  - due_date
attachment_extraction:
  enabled: true
  max_pdf_bytes: 26214400
  max_pdf_pages: 100
  max_text_bytes: 2097152
  max_output_bytes: 5242880
  max_supported_attachments_per_message: 20
  timeout_seconds_per_attachment: 60
  timeout_seconds_per_message: 120
  note_chars_per_attachment: 50000
  note_chars_per_message: 100000
processors:
  # The RescueTime example ships with Mailkeep; opt in by setting enabled: true.
  enabled: false
  scratch_root: ./tmp/codex/processors
  instances:
    - id: personal-rescuetime
      implementation: rescuetime-weekly
      series_id: personal
      match:
        from_addresses: [support@rescuetime.com]
        subject_contains: [RescueTime Weekly Summary]
      options:
        # Confirm this matches the timezone configured in your RescueTime account.
        report_timezone: Australia/Melbourne
        metric: total_distracting_time
        layout: weekly-v1
enrichment:
  # "none" keeps everything local and needs no extra service or key.
  # "ollama" uses a local model. "jev" uses the hosted Typesafe backend and
  # needs MAILKEEP_JEV_API_KEY.
  provider: none
  timeout_seconds: 30
  # provider: ollama
  # model: llama3.2
  # endpoint: http://localhost:11434
  # privacy: local
  # provider: jev
  # model: jev-latest
  # endpoint: https://api.typesafe.ai
  # api_key_env: MAILKEEP_JEV_API_KEY
  # privacy: redacted
